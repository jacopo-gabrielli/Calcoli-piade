<!doctype html>
<html lang="it">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,user-scalable=no">
  <meta name="theme-color" content="#111827">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="Cassa Piadine">
  <link rel="manifest" href="manifest.webmanifest">
  <link rel="apple-touch-icon" href="icon-192.png">
  <title>Cassa Piadine</title>
  <style>
    :root {
      color-scheme: dark;
      --bg: #0f1115;
      --panel: #171a21;
      --panel2: #20242d;
      --text: #f7f7f8;
      --muted: #a8adb8;
      --danger: #d14b4b;
      --radius: 18px;
      --safe-top: env(safe-area-inset-top, 0px);
      --safe-bottom: env(safe-area-inset-bottom, 0px);
    }
    * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
    html, body { margin: 0; min-height: 100%; background: var(--bg); color: var(--text); font-family: -apple-system, BlinkMacSystemFont, "SF Pro Display", "Segoe UI", sans-serif; }
    body { min-height: 100dvh; overscroll-behavior: none; }
    button, input { font: inherit; }
    button { touch-action: manipulation; user-select: none; -webkit-user-select: none; }
    .app {
      min-height: 100dvh;
      max-width: 560px;
      margin: 0 auto;
      padding: calc(4px + var(--safe-top)) 12px calc(8px + var(--safe-bottom));
      display: flex;
      flex-direction: column;
      gap: 9px;
    }
    .icon-btn {
      position: absolute;
      top: 10px; right: 10px;
      width: 42px; height: 42px; border-radius: 13px; border: 0;
      background: rgba(255,255,255,.055); color: var(--text); font-size: 20px;
      display:flex; align-items:center; justify-content:center;
      z-index: 2;
    }
    .icon-btn:active { transform: scale(.96); background: rgba(255,255,255,.11); }

    .total-card {
      position: relative;
      background: linear-gradient(180deg, #191d25 0%, #13161c 100%);
      border: 1px solid #282d37;
      border-radius: 22px;
      padding: 10px 58px 12px;
      text-align: center;
      box-shadow: 0 8px 30px rgba(0,0,0,.22);
      flex: none;
    }
    .total-label { color: var(--muted); font-size: 12px; font-weight: 800; letter-spacing: .16em; }
    .total { font-size: clamp(42px, 13vw, 70px); font-weight: 900; line-height: 1.05; letter-spacing: -.04em; margin-top: 2px; }

    .summary {
      background: var(--panel);
      border-radius: var(--radius);
      padding: 6px;
      min-height: 62px;
      max-height: none;
      overflow: visible;
      border: 1px solid #252a33;
      flex: none;
    }
    .empty {
      color: var(--muted); min-height: 48px; display:flex; align-items:center; justify-content:center;
      font-size: 14px;
    }
    .summary-row {
      width: 100%; border: 0; color: var(--text); background: transparent;
      min-height: 44px; display:grid; grid-template-columns: 8px 1fr auto auto;
      gap: 10px; align-items:center; text-align:left; padding: 6px 8px;
      border-radius: 12px;
    }
    .summary-row:active { background: #262b35; }
    .stripe { width: 8px; height: 30px; border-radius: 8px; }
    .row-name { font-weight: 760; font-size: 15px; }
    .row-qty { color: var(--muted); font-weight: 800; }
    .row-subtotal { min-width: 72px; text-align:right; font-weight: 800; }

    .product-grid {
      margin-top: auto;
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 9px;
    }
    .product-btn {
      position: relative;
      min-height: 92px;
      border: 0;
      border-radius: 20px;
      padding: 13px 12px 12px;
      text-align: left;
      box-shadow: inset 0 -2px 0 rgba(0,0,0,.16), 0 5px 14px rgba(0,0,0,.14);
      transition: transform .06s ease, filter .06s ease;
      overflow: hidden;
    }
    .product-btn:nth-child(5) { grid-column: 1 / -1; min-height: 82px; }
    .product-btn:active, .product-btn.pressed { transform: scale(.975); filter: brightness(.9); }
    .product-name { display:block; font-size: 19px; font-weight: 900; line-height: 1.05; letter-spacing: -.02em; }
    .product-price { display:block; margin-top: 7px; font-size: 15px; font-weight: 780; opacity: .9; }
    .count-badge {
      position:absolute; right: 11px; top: 10px; min-width: 30px; height: 30px;
      padding: 0 8px; border-radius: 999px; display:flex; align-items:center; justify-content:center;
      background: rgba(0,0,0,.24); color:white; font-size: 14px; font-weight: 900;
      backdrop-filter: blur(3px);
    }
    .count-badge.zero { opacity: .32; }

    .bottom-actions { display:grid; grid-template-columns: 1fr 1.25fr; gap: 9px; }
    .action-btn {
      min-height: 58px; border:0; border-radius: 17px; color: var(--text);
      background: var(--panel2); font-weight: 900; font-size: 15px;
      position: relative; overflow:hidden;
    }
    .action-btn:disabled { opacity:.35; }
    .action-btn:active:not(:disabled) { transform:scale(.985); }
    .new-order { background: #4c2222; }
    .new-order::after {
      content:""; position:absolute; inset:0; background: rgba(255,255,255,.18);
      transform: scaleX(0); transform-origin:left center;
    }
    .new-order.holding::after { transform: scaleX(1); transition: transform .65s linear; }

    .hint { text-align:center; color:#767d89; font-size:11px; margin-top:-2px; }

    .modal {
      position: fixed; inset:0; z-index:50; display:none; align-items:flex-end; justify-content:center;
      background: rgba(0,0,0,.62); padding-top: var(--safe-top);
    }
    .modal.open { display:flex; }
    .sheet {
      width:100%; max-width:560px; max-height:94dvh; overflow:auto;
      border-radius: 24px 24px 0 0; background:#171a21; border:1px solid #2a303a;
      padding: 16px 14px calc(18px + var(--safe-bottom));
      box-shadow: 0 -10px 40px rgba(0,0,0,.4);
    }
    .sheet-head { display:flex; align-items:center; justify-content:space-between; gap:10px; margin-bottom:12px; }
    .sheet h2 { margin:0; font-size:24px; }
    .close-btn { width:40px; height:40px; border-radius:12px; border:0; background:#272c35; color:white; font-size:22px; }
    .settings-item {
      background:#20242d; border:1px solid #2b313c; border-radius:17px; padding:12px; margin-bottom:10px;
    }
    .settings-title { font-weight:900; margin-bottom:9px; }
    .settings-line { display:grid; grid-template-columns: 84px 1fr; gap:10px; align-items:center; margin-bottom:10px; }
    .settings-line label { color:var(--muted); font-size:14px; font-weight:700; }
    .price-input {
      width:100%; min-height:44px; border-radius:12px; border:1px solid #3a414e;
      background:#12151b; color:white; padding:0 12px; font-weight:800; font-size:18px;
    }
    .swatches { display:flex; flex-wrap:wrap; gap:9px; align-items:center; }
    .swatch {
      width:36px; height:36px; border-radius:11px; border:3px solid transparent; padding:0;
      box-shadow: inset 0 0 0 1px rgba(255,255,255,.16);
    }
    .swatch.selected { border-color:white; }
    .custom-color {
      width:42px; height:36px; padding:0; border:0; border-radius:10px; background:transparent; overflow:hidden;
    }
    .setting-toggle {
      display:flex; justify-content:space-between; gap:12px; align-items:center;
      background:#20242d; border:1px solid #2b313c; border-radius:17px; padding:13px;
      margin-top:12px;
    }
    .toggle {
      appearance:none; width:48px; height:28px; border-radius:999px; background:#454b55;
      position:relative; transition:.15s; flex:none;
    }
    .toggle::after {
      content:""; position:absolute; width:22px; height:22px; top:3px; left:3px; border-radius:50%;
      background:white; transition:.15s;
    }
    .toggle:checked { background:#2f8a4c; }
    .toggle:checked::after { transform:translateX(20px); }

    .save-btn {
      width:100%; min-height:56px; border:0; border-radius:17px; margin-top:14px;
      font-weight:900; font-size:17px; background:#f2f3f5; color:#111318;
    }
    .reset-btn {
      width:100%; min-height:46px; border:1px solid #3a414c; border-radius:14px; margin-top:10px;
      background:transparent; color:#c7cbd2; font-weight:750;
    }
    .settings-note { color:var(--muted); font-size:12px; line-height:1.4; margin:8px 2px 0; }

    .qty-sheet { text-align:center; padding-top:22px; }
    .qty-color { width:44px; height:8px; border-radius:9px; margin:0 auto 12px; }
    .qty-title { font-size:22px; font-weight:900; margin:0; }
    .qty-price { color:var(--muted); margin-top:4px; }
    .qty-controls { display:grid; grid-template-columns: 1fr 1fr 1fr; gap:12px; align-items:center; margin:20px 0; }
    .qty-btn {
      height:64px; border:0; border-radius:18px; background:#2a2f39; color:white;
      font-size:32px; font-weight:800;
    }
    .qty-number { font-size:40px; font-weight:900; }
    .qty-close { width:100%; height:52px; border:0; border-radius:16px; background:#efeff1; color:#111; font-weight:900; }

    .toast {
      position:fixed; left:50%; bottom:calc(92px + var(--safe-bottom)); z-index:90;
      transform:translate(-50%, 18px); opacity:0; pointer-events:none;
      background:#eef0f3; color:#101218; padding:10px 15px; border-radius:999px;
      font-weight:850; font-size:14px; transition:.18s;
      box-shadow:0 8px 30px rgba(0,0,0,.28);
    }
    .toast.show { opacity:1; transform:translate(-50%, 0); }

    @media (min-height: 800px) {
      .product-btn { min-height: 100px; }
    }
    @media (max-height: 670px) {
      .app { gap:7px; padding-top:calc(2px + var(--safe-top)); }
      .icon-btn { width:38px; height:38px; top:7px; right:7px; }
      .total-card { padding:8px 50px 9px; }
      .total { font-size:42px; }
      .summary-row { min-height: 40px; padding-top:4px; padding-bottom:4px; }
      .stripe { height:26px; }
      .product-btn { min-height:70px; }
      .product-btn:nth-child(5) { min-height:64px; }
      .product-name { font-size:17px; }
      .bottom-actions .action-btn { min-height:48px; }
      .hint { display:none; }
    }
  </style>
</head>
<body>
  <main class="app">
    <section class="total-card" aria-live="polite">
      <button id="settingsBtn" class="icon-btn" aria-label="Impostazioni" title="Impostazioni">⚙︎</button>
      <div class="total-label">TOTALE</div>
      <div id="total" class="total">0,00 €</div>
    </section>

    <section id="summary" class="summary" aria-label="Riepilogo ordine"></section>

    <section id="productGrid" class="product-grid" aria-label="Articoli"></section>

    <section class="bottom-actions">
      <button id="undoBtn" class="action-btn" disabled>↶ ANNULLA</button>
      <button id="newOrderBtn" class="action-btn new-order">TIENI PREMUTO<br>NUOVO ORDINE</button>
    </section>
    <div class="hint">Tocca una riga del riepilogo per correggere la quantità</div>
  </main>

  <div id="settingsModal" class="modal" role="dialog" aria-modal="true" aria-label="Impostazioni">
    <div class="sheet">
      <div class="sheet-head">
        <h2>Impostazioni</h2>
        <button id="settingsClose" class="close-btn" aria-label="Chiudi">×</button>
      </div>
      <div id="settingsList"></div>

      <label class="setting-toggle">
        <span>
          <strong>Blocca impostazioni</strong><br>
          <small style="color:var(--muted)">Se attivo, tieni premuto ⚙︎ per 1,5 secondi</small>
        </span>
        <input id="lockSettings" class="toggle" type="checkbox">
      </label>

      <button id="saveSettings" class="save-btn">SALVA IMPOSTAZIONI</button>
      <button id="resetSettings" class="reset-btn">Ripristina prezzi e colori iniziali</button>
      <p class="settings-note">Prezzi, colori e ordine corrente vengono salvati solo su questo dispositivo.</p>
    </div>
  </div>

  <div id="qtyModal" class="modal" role="dialog" aria-modal="true" aria-label="Modifica quantità">
    <div class="sheet qty-sheet">
      <div id="qtyColor" class="qty-color"></div>
      <h2 id="qtyTitle" class="qty-title"></h2>
      <div id="qtyPrice" class="qty-price"></div>
      <div class="qty-controls">
        <button id="qtyMinus" class="qty-btn" aria-label="Diminuisci">−</button>
        <div id="qtyNumber" class="qty-number">0</div>
        <button id="qtyPlus" class="qty-btn" aria-label="Aumenta">+</button>
      </div>
      <button id="qtyClose" class="qty-close">CHIUDI</button>
    </div>
  </div>

  <div id="toast" class="toast" aria-live="polite"></div>

<script>
(() => {
  "use strict";

  const DEFAULTS = [
    { id:"p1", name:"Piada 1 gusto", short:"1 GUSTO", price:800, color:"#2E7D32" },
    { id:"p2", name:"Piada 2 gusti", short:"2 GUSTI", price:850, color:"#1565C0" },
    { id:"p3", name:"Piada 3 gusti", short:"3 GUSTI", price:900, color:"#6A1B9A" },
    { id:"pat", name:"Patatine", short:"PATATINE", price:400, color:"#EF6C00" },
    { id:"acq", name:"Acqua", short:"ACQUA", price:200, color:"#0288D1" }
  ];
  const SWATCHES = ["#2E7D32","#1565C0","#6A1B9A","#EF6C00","#C62828","#F9A825","#6D4C41","#455A64","#00897B","#AD1457"];
  const SETTINGS_KEY = "cassaPiadine.settings.v1";
  const ORDER_KEY = "cassaPiadine.order.v1";
  const ACTIONS_KEY = "cassaPiadine.actions.v1";

  const $ = sel => document.querySelector(sel);
  const totalEl = $("#total"), summaryEl = $("#summary"), productGrid = $("#productGrid");
  const undoBtn = $("#undoBtn"), newOrderBtn = $("#newOrderBtn"), settingsBtn = $("#settingsBtn");
  const settingsModal = $("#settingsModal"), qtyModal = $("#qtyModal");
  const toastEl = $("#toast");

  let settings = loadSettings();
  let order = loadOrder();
  let actions = loadActions();
  let editId = null;
  let settingsHoldTimer = null;
  let newOrderTimer = null;

  function cloneDefaults() {
    return DEFAULTS.map(x => ({...x}));
  }
  function loadSettings() {
    try {
      const raw = JSON.parse(localStorage.getItem(SETTINGS_KEY) || "null");
      if (!raw || !Array.isArray(raw.items)) throw new Error();
      const items = cloneDefaults().map(def => {
        const saved = raw.items.find(x => x.id === def.id) || {};
        return {
          ...def,
          price: Number.isInteger(saved.price) && saved.price >= 0 ? saved.price : def.price,
          color: /^#[0-9a-f]{6}$/i.test(saved.color || "") ? saved.color : def.color
        };
      });
      return { items, locked: !!raw.locked };
    } catch {
      return { items: cloneDefaults(), locked:false };
    }
  }
  function loadOrder() {
    try {
      const raw = JSON.parse(localStorage.getItem(ORDER_KEY) || "{}");
      const out = {};
      DEFAULTS.forEach(x => out[x.id] = Number.isInteger(raw[x.id]) && raw[x.id] >= 0 ? raw[x.id] : 0);
      return out;
    } catch {
      return Object.fromEntries(DEFAULTS.map(x => [x.id, 0]));
    }
  }
  function loadActions() {
    try {
      const raw = JSON.parse(localStorage.getItem(ACTIONS_KEY) || "[]");
      if (!Array.isArray(raw)) return [];
      return raw.filter(a => DEFAULTS.some(x => x.id === a.id) && (a.delta === 1 || a.delta === -1)).slice(-100);
    } catch { return []; }
  }
  function saveSettingsData() {
    localStorage.setItem(SETTINGS_KEY, JSON.stringify(settings));
  }
  function saveOrderData() {
    localStorage.setItem(ORDER_KEY, JSON.stringify(order));
    localStorage.setItem(ACTIONS_KEY, JSON.stringify(actions.slice(-100)));
  }

  function euro(cents) {
    return (cents / 100).toLocaleString("it-IT", {style:"currency", currency:"EUR"});
  }
  function textColor(hex) {
    const c = hex.replace("#","");
    const r = parseInt(c.slice(0,2),16), g = parseInt(c.slice(2,4),16), b = parseInt(c.slice(4,6),16);
    const luminance = (0.299*r + 0.587*g + 0.114*b);
    return luminance > 165 ? "#111318" : "#ffffff";
  }
  function item(id) { return settings.items.find(x => x.id === id); }
  function haptic(ms=10) {
    try { if (navigator.vibrate) navigator.vibrate(ms); } catch {}
  }
  function showToast(msg) {
    toastEl.textContent = msg;
    toastEl.classList.add("show");
    clearTimeout(showToast.t);
    showToast.t = setTimeout(() => toastEl.classList.remove("show"), 1400);
  }

  function render() {
    const total = settings.items.reduce((sum, p) => sum + p.price * (order[p.id] || 0), 0);
    totalEl.textContent = euro(total);

    summaryEl.innerHTML = "";
    const selected = settings.items.filter(p => order[p.id] > 0);
    if (!selected.length) {
      summaryEl.innerHTML = '<div class="empty">Nessun articolo</div>';
    } else {
      selected.forEach(p => {
        const row = document.createElement("button");
        row.className = "summary-row";
        row.dataset.id = p.id;
        row.innerHTML = `
          <span class="stripe" style="background:${p.color}"></span>
          <span class="row-name">${p.name}</span>
          <span class="row-qty">× ${order[p.id]}</span>
          <span class="row-subtotal">${euro(p.price * order[p.id])}</span>`;
        row.addEventListener("click", () => openQty(p.id));
        summaryEl.appendChild(row);
      });
    }

    productGrid.innerHTML = "";
    settings.items.forEach(p => {
      const btn = document.createElement("button");
      btn.className = "product-btn";
      btn.dataset.id = p.id;
      btn.style.background = p.color;
      btn.style.color = textColor(p.color);
      btn.innerHTML = `
        <span class="product-name">${p.short}</span>
        <span class="product-price">${euro(p.price)}</span>
        <span class="count-badge ${order[p.id] ? "" : "zero"}">${order[p.id] || 0}</span>`;
      btn.addEventListener("click", () => changeQty(p.id, 1, true));
      productGrid.appendChild(btn);
    });

    undoBtn.disabled = actions.length === 0;
  }

  function changeQty(id, delta, track=true) {
    const current = order[id] || 0;
    if (delta < 0 && current <= 0) return;
    order[id] = Math.max(0, current + delta);
    if (track) actions.push({id, delta});
    saveOrderData();
    haptic(8);
    render();
    if (qtyModal.classList.contains("open") && editId === id) renderQty();
  }

  function undo() {
    const a = actions.pop();
    if (!a) return;
    order[a.id] = Math.max(0, (order[a.id] || 0) - a.delta);
    saveOrderData();
    haptic(12);
    render();
    showToast("Ultima azione annullata");
  }

  function resetOrder() {
    Object.keys(order).forEach(k => order[k] = 0);
    actions = [];
    saveOrderData();
    haptic(25);
    render();
    showToast("Nuovo ordine");
  }

  function openQty(id) {
    editId = id;
    renderQty();
    qtyModal.classList.add("open");
  }
  function renderQty() {
    const p = item(editId);
    if (!p) return;
    $("#qtyTitle").textContent = p.name;
    $("#qtyPrice").textContent = euro(p.price) + " cad.";
    $("#qtyColor").style.background = p.color;
    $("#qtyNumber").textContent = order[p.id] || 0;
    $("#qtyMinus").disabled = (order[p.id] || 0) === 0;
  }

  function parsePriceToCents(value) {
    const s = String(value).trim().replace(/[€\s]/g,"").replace(",",".");
    if (!/^\d+(\.\d{1,2})?$/.test(s)) return null;
    const n = Number(s);
    if (!Number.isFinite(n) || n < 0 || n > 9999) return null;
    return Math.round(n * 100);
  }

  function buildSettings() {
    const list = $("#settingsList");
    list.innerHTML = "";
    settings.items.forEach(p => {
      const box = document.createElement("div");
      box.className = "settings-item";
      box.dataset.id = p.id;
      box.innerHTML = `
        <div class="settings-title">${p.name}</div>
        <div class="settings-line">
          <label>Prezzo</label>
          <input class="price-input" inputmode="decimal" autocomplete="off" value="${(p.price/100).toFixed(2).replace(".",",")}">
        </div>
        <div class="settings-line">
          <label>Colore</label>
          <div class="swatches"></div>
        </div>`;
      const swatches = box.querySelector(".swatches");
      SWATCHES.forEach(color => {
        const b = document.createElement("button");
        b.type = "button";
        b.className = "swatch" + (color.toLowerCase() === p.color.toLowerCase() ? " selected" : "");
        b.style.background = color;
        b.dataset.color = color;
        b.setAttribute("aria-label", "Colore " + color);
        b.addEventListener("click", () => {
          box.dataset.selectedColor = color;
          swatches.querySelectorAll(".swatch").forEach(x => x.classList.remove("selected"));
          b.classList.add("selected");
          custom.value = color;
        });
        swatches.appendChild(b);
      });
      const custom = document.createElement("input");
      custom.type = "color";
      custom.className = "custom-color";
      custom.value = p.color;
      custom.setAttribute("aria-label","Colore personalizzato");
      custom.addEventListener("input", () => {
        box.dataset.selectedColor = custom.value;
        swatches.querySelectorAll(".swatch").forEach(x => x.classList.remove("selected"));
      });
      swatches.appendChild(custom);
      box.dataset.selectedColor = p.color;
      list.appendChild(box);
    });
    $("#lockSettings").checked = settings.locked;
  }

  function openSettings(force=false) {
    if (settings.locked && !force) return;
    buildSettings();
    settingsModal.classList.add("open");
  }

  function saveSettings() {
    const boxes = [...document.querySelectorAll(".settings-item")];
    const nextItems = [];
    for (const box of boxes) {
      const old = item(box.dataset.id);
      const cents = parsePriceToCents(box.querySelector(".price-input").value);
      if (cents === null) {
        box.querySelector(".price-input").focus();
        showToast("Controlla il prezzo");
        return;
      }
      nextItems.push({...old, price:cents, color:box.dataset.selectedColor || old.color});
    }
    settings.items = nextItems;
    settings.locked = $("#lockSettings").checked;
    saveSettingsData();
    settingsModal.classList.remove("open");
    render();
    haptic(15);
    showToast("Impostazioni salvate");
  }

  function restoreSettings() {
    settings = {items:cloneDefaults(), locked:false};
    saveSettingsData();
    buildSettings();
    render();
    showToast("Valori iniziali ripristinati");
  }

  // Settings: tap normally when unlocked; long-press when locked.
  settingsBtn.addEventListener("pointerdown", (e) => {
    if (!settings.locked) return;
    e.preventDefault();
    settingsBtn.style.transform = "scale(.94)";
    settingsHoldTimer = setTimeout(() => {
      settingsHoldTimer = null;
      settingsBtn.style.transform = "";
      haptic(20);
      openSettings(true);
    }, 1500);
  });
  ["pointerup","pointercancel","pointerleave"].forEach(evt => settingsBtn.addEventListener(evt, () => {
    if (settingsHoldTimer) clearTimeout(settingsHoldTimer);
    settingsHoldTimer = null;
    settingsBtn.style.transform = "";
  }));
  settingsBtn.addEventListener("click", () => {
    if (!settings.locked) openSettings(true);
    else showToast("Tieni premuto ⚙︎");
  });

  // New order: deliberate long press.
  const cancelNewOrderHold = () => {
    if (newOrderTimer) clearTimeout(newOrderTimer);
    newOrderTimer = null;
    newOrderBtn.classList.remove("holding");
  };
  newOrderBtn.addEventListener("pointerdown", (e) => {
    e.preventDefault();
    cancelNewOrderHold();
    // Force reflow so progress restarts every time.
    void newOrderBtn.offsetWidth;
    newOrderBtn.classList.add("holding");
    newOrderTimer = setTimeout(() => {
      newOrderTimer = null;
      newOrderBtn.classList.remove("holding");
      resetOrder();
    }, 650);
  });
  ["pointerup","pointercancel","pointerleave"].forEach(evt => newOrderBtn.addEventListener(evt, cancelNewOrderHold));
  newOrderBtn.addEventListener("contextmenu", e => e.preventDefault());

  undoBtn.addEventListener("click", undo);
  $("#settingsClose").addEventListener("click", () => settingsModal.classList.remove("open"));
  $("#saveSettings").addEventListener("click", saveSettings);
  $("#resetSettings").addEventListener("click", restoreSettings);
  $("#qtyClose").addEventListener("click", () => qtyModal.classList.remove("open"));
  $("#qtyMinus").addEventListener("click", () => editId && changeQty(editId, -1, true));
  $("#qtyPlus").addEventListener("click", () => editId && changeQty(editId, 1, true));

  [settingsModal, qtyModal].forEach(modal => modal.addEventListener("click", e => {
    if (e.target === modal) modal.classList.remove("open");
  }));

  document.addEventListener("visibilitychange", () => {
    if (document.visibilityState === "hidden") saveOrderData();
  });
  window.addEventListener("pagehide", saveOrderData);

  if ("serviceWorker" in navigator) {
    let swRefreshing = false;
    navigator.serviceWorker.addEventListener("controllerchange", () => {
      if (swRefreshing) return;
      swRefreshing = true;
      window.location.reload();
    });
    window.addEventListener("load", () => {
      navigator.serviceWorker.register("./sw.js", { updateViaCache: "none" })
        .then(reg => reg.update())
        .catch(() => {});
    });
  }

  render();
})();
</script>
</body>
</html>
